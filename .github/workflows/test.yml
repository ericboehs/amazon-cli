name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Run web_test (95% line + branch coverage gate)
        run: ruby test/web_test.rb
