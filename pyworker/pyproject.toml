[project]
name = "amazon-cli-pyworker"
version = "0.1.0"
description = "Python worker for the amazon CLI — drives amazon-orders to fetch personal order history."
requires-python = ">=3.10"
dependencies = [
    "amazon-orders>=4.0.18,<5",
    "playwright>=1.49,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fetch.py"]
